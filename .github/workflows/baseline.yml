name: Backend verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Generation/build need syntactically valid configuration, not a hosted DB.
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/silentrave_validation
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/silentrave_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies with Bun
        if: matrix.platform == 'linux'
        run: bun install --frozen-lockfile
      - name: Install locked dependencies with npm
        if: matrix.platform == 'win32'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bun run db:generate
      - run: bun run lint
      - run: bun run typecheck
      - name: Build isolated client preview
        run: bun --no-env-file run preview:build
      - run: bun --no-env-file run test:readiness
      - run: bun --no-env-file run test:runtime-policy
      - run: bun --no-env-file run check:route-policy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-pdf-test.txt
      - run: bun run scanner:build
      - run: bun --no-env-file scripts/install-netlify-tools.ts
      - run: bun --no-env-file scripts/build-netlify-offline.ts
      - run: bun --no-env-file scripts/verify-netlify-artifacts.ts
      - run: bun --no-env-file scripts/verify-netlify-node.ts
      - run: bun --no-env-file run db:preflight
      - run: bun --no-env-file run db:preflight-storage
      - run: bun --no-env-file run test:step5a
      - name: Install pinned owned browser test client
        if: matrix.platform == 'linux'
        run: npm install --prefix .test-runtime/browser-check --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.58.2
      - name: Verify receipt and banner flows in owned Chrome
        if: matrix.platform == 'linux'
        run: |
          export BROWSER_EXECUTABLE="$(command -v google-chrome)"
          test -n "$BROWSER_EXECUTABLE"
          bun --no-env-file scripts/run-browser-step5a.ts
      - name: Verify static client preview in owned Chrome
        if: matrix.platform == 'linux'
        run: |
          export BROWSER_EXECUTABLE="$(command -v google-chrome)"
          test -n "$BROWSER_EXECUTABLE"
          node scripts/browser-client-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step5a-evidence-${{ matrix.platform }}
          path: |
            reports/step5c1-*-test-output.txt
            reports/step5c1-netlify-*-build.txt
            reports/step5c1-*-acceptance.json
            reports/step5a-*-test-output.txt
            reports/step5a-*-migration-backfill.txt
            reports/step5a-mobile-*.png
            reports/client-preview-build.json
            reports/client-preview/
            out/client-preview/
            reports/step5-*-db-preflight.txt
