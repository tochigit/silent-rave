name: Backend verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Generation/build need syntactically valid configuration, not a hosted DB.
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/silentrave_validation
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/silentrave_validation
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies with Bun
        if: matrix.platform == 'linux'
        run: bun install --frozen-lockfile
      - name: Install locked dependencies with npm
        if: matrix.platform == 'win32'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bun run db:generate
      - run: bun run lint
      - run: bun run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-pdf-test.txt
      - run: bun run test:phase4
      - run: bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-test-evidence-${{ matrix.platform }}
          path: reports/phase4-${{ matrix.platform }}-test-output.txt
