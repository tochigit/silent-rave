name: Baseline verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Generation/build need syntactically valid configuration, not a hosted DB.
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/silentrave_validation
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/silentrave_validation
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:phase3b
      - run: bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-test-evidence
          path: reports/phase3b-test-output.txt
