name: Backend verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Generation/build need syntactically valid configuration, not a hosted DB.
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/silentrave_validation
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/silentrave_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies with Bun
        if: matrix.platform == 'linux'
        run: bun install --frozen-lockfile
      - name: Install locked dependencies with npm
        if: matrix.platform == 'win32'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: bun run db:generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun --no-env-file run test:readiness
      - run: bun --no-env-file run test:runtime-policy
      - run: bun --no-env-file run check:route-policy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-pdf-test.txt
      - run: bun run scanner:build
      - run: bun --no-env-file scripts/install-netlify-tools.ts
      - run: bun --no-env-file scripts/build-netlify-offline.ts
      - run: bun --no-env-file scripts/verify-netlify-artifacts.ts
      - run: bun run test:step5c1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step5c1-evidence-${{ matrix.platform }}
          path: |
            reports/step5c1-*-test-output.txt
            reports/step5c1-netlify-*-build.txt
            reports/step5c1-*-acceptance.json
